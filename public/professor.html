<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduClass - Painel do Professor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex">

    <!-- Menu Lateral -->
    <div class="w-64 bg-green-800 h-screen text-white p-6 shadow-xl">
        <h1 class="text-2xl font-bold mb-8 text-center border-b border-green-600 pb-4">EduClass</h1>
        <nav class="space-y-3">
            <a href="#" class="block py-2.5 px-4 rounded bg-green-900 font-semibold">🏠 Minhas Turmas</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-green-700 transition">📝 Lançar Notas</a>
            <a href="/" class="block py-2.5 px-4 rounded hover:bg-red-600 transition mt-10">🚪 Sair</a>
        </nav>
    </div>

    <div class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <h2 class="text-3xl font-bold text-gray-800">Painel do Professor</h2>
            <span class="bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">Ambiente: Docente</span>
        </header>

        <div class="bg-white p-8 rounded-lg shadow-sm">
            <h3 class="text-xl font-bold text-gray-800 mb-4">👋 Boas-vindas ao seu painel!</h3>
            <p class="text-gray-600">Aqui você poderá gerenciar suas aulas, chamadas e notas dos alunos brevemente.</p>
