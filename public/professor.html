<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - EduClass</title>
</head>
<body>

    <h1>EduClass Professor</h1>
    
    <!-- Formulário de Planejamento de Aula -->
    <div>
        <h2>📝 Novo Planejamento de Aula</h2>
        <form id="formPlanejamento">
            <label for="materia">Matéria / Disciplina:</label><br>
            <input type="text" id="materia" name="materia" required><br><br>

            <label for="conteudo">Conteúdo da Aula:</label><br>
            <textarea id="conteudo" name="conteudo" required></textarea><br><br>

            <label for="data_planejada">Data Planejada:</label><br>
            <input type="date" id="data_planejada" name="data_planejada" required><br><br>
            
            <button type="submit">Salvar Planejamento</button>
        </form>
    </div>

    <br><hr><br>

    <!-- Área de Exibição dos Planejamentos -->
    <div>
        <h2>📋 Meus Planejamentos Salvos</h2>
        <div id="listaPlanejamentos">Carregando planejamentos...</div>
    </div>

    <script>
        function carregarPlanejamentos() {
            fetch('/listar-planejamentos')
                .then(res => res.json())
                .then(dados => {
                    const painel = document.getElementById('listaPlanejamentos');
                    if (!dados || dados.length === 0) {
                        painel.innerHTML = '<p>Nenhum planejamento salvo ainda.</p>';
                        return;
                    }
                    painel.innerHTML = dados.map(p => `
                        <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                            <h3>Matéria: ${p.materia}</h3>
                            <p><strong>Conteúdo:</strong> ${p.conteudo}</p>
                            <p>📅 <strong>Data:</strong> ${p.data_planejada}</p>
                            <button onclick="apagarPlanejamento(${p.id})">Apagar</button>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('listaPlanejamentos').innerHTML = '<p>Erro ao carregar planejamentos.</p>';
                });
        }

        function apagarPlanejamento(id) {
            if (confirm('Deseja apagar este planejamento?')) {
                fetch(`/apagar-planejamento/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => {
                        carregarPlanejamentos();
                    });
            }
        }

        document.getElementById('formPlanejamento').addEventListener('submit', function(e) {
            e.preventDefault();
            const dados = new URLSearchParams(new FormData(this));
            
            fetch('/criar-planejamento', { method: 'POST', body: dados })
                .then(() => {
                    this.reset();
                    carregarPlanejamentos();
                });
        });

        // Carrega os dados na primeira abertura
        carregarPlanejamentos();
    </script>
</body>
</html>
