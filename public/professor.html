<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - EduClass</title>
</head>
<body>

    <h1>EduClass Professor</h1>

    <!-- SEÇÃO 1: MURAL E AGENDA DA COORDENAÇÃO (APENAS LEITURA) -->
    <div style="background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 30px;">
        <h2>📢 Comunicados da Direção / Coordenação</h2>
        <div id="muralDirecao">Carregando recados da direção...</div>

        <br>

        <h2>📅 Agenda e Eventos Escolares</h2>
        <div id="calendarioDirecao">Carregando eventos escolares...</div>
    </div>

    <hr>

    <!-- SEÇÃO 2: FORMULÁRIO DE PLANEJAMENTO -->
    <div>
        <h2>📝 Novo Planejamento de Aula</h2>
        <form id="formPlanejamento">
            <label for="materia">Matéria / Disciplina:</label><br>
            <input type="text" id="materia" name="materia" required><br><br>

            <label for="conteudo">Conteúdo da Aula:</label><br>
            <textarea id="conteudo" name="conteudo" required></textarea><br><br>

            <label for="data_planejada">Data Planejada:</label><br>
            <input type="date" id="data_planejada" name="data_planejada" required><br><br>
            
            <button type="submit">Salvar Planejamento</button>
        </form>
    </div>

    <br><hr><br>

    <!-- SEÇÃO 3: LISTA DOS PLANEJAMENTOS DO PROFESSOR -->
    <div>
        <h2>📋 Meus Planejamentos Salvos</h2>
        <div id="listaPlanejamentos">Carregando planejamentos...</div>
    </div>

    <script>
        // 1. Busca os RECADOS criados pelo gestor para mostrar ao professor
        function carregarRecadosDaDirecao() {
            fetch('/listar-recados')
                .then(res => res.json())
                .then(recados => {
                    const div = document.getElementById('muralDirecao');
                    if (!recados || recados.length === 0) {
                        div.innerHTML = '<p>Nenhum comunicado oficial recente.</p>';
                        return;
                    }
                    div.innerHTML = recados.map(r => `
                        <div style="background: white; border-left: 4px solid #007bff; padding: 10px; margin-bottom: 10px;">
                            <h4>${r.titulo}</h4>
                            <p>${r.conteudo}</p>
                            <small>Enviado por: <strong>${r.autor}</strong></small>
                        </div>
                    `).join('');
                });
        }

        // 2. Busca os EVENTOS criados pelo gestor para mostrar ao professor
        function carregarEventosDaDirecao() {
            fetch('/listar-eventos')
                .then(res => res.json())
                .then(eventos => {
                    const div = document.getElementById('calendarioDirecao');
                    if (!eventos || eventos.length === 0) {
                        div.innerHTML = '<p>Nenhum evento agendado.</p>';
                        return;
                    }
                    div.innerHTML = eventos.map(e => `
                        <div style="background: white; border-left: 4px solid #28a745; padding: 10px; margin-bottom: 10px;">
                            <h4>${e.titulo}</h4>
                            <p>📅 Data: ${e.data_evento}</p>
                            ${e.descricao ? `<p>ℹ️ ${e.descricao}</p>` : ''}
                        </div>
                    `).join('');
                });
        }

        // 3. Busca os PLANEJAMENTOS do próprio professor
        function carregarPlanejamentos() {
            fetch('/listar-planejamentos')
                .then(res => res.json())
                .then(dados => {
                    const painel = document.getElementById('listaPlanejamentos');
                    if (!dados || dados.length === 0) {
                        painel.innerHTML = '<p>Nenhum planejamento salvo ainda.</p>';
                        return;
                    }
                    painel.innerHTML = dados.map(p => `
                        <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                            <h3>Matéria: ${p.materia}</h3>
                            <p><strong>Conteúdo:</strong> ${p.conteudo}</p>
                            <p>📅 <strong>Data:</strong> ${p.data_planejada}</p>
                            <button onclick="apagarPlanejamento(${p.id})">Apagar</button>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('listaPlanejamentos').innerHTML = '<p>Erro ao carregar planejamentos.</p>';
                });
        }

        function apagarPlanejamento(id) {
            if (confirm('Deseja apagar este planejamento?')) {
                fetch(`/apagar-planejamento/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => {
                        carregarPlanejamentos();
                    });
            }
        }

        document.getElementById('formPlanejamento').addEventListener('submit', function(e) {
            e.preventDefault();
            const dados = new URLSearchParams(new FormData(this));
            
            fetch('/criar-planejamento', { method: 'POST', body: dados })
                .then(() => {
                    this.reset();
                    carregarPlanejamentos();
                });
        });

        // Executa apenas as listagens corretas
        carregarRecadosDaDirecao();
        carregarEventosDaDirecao();
        carregarPlanejamentos();
    </script>
</body>
</html>
