<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduClass | Chamada</title>

    <link rel="stylesheet" href="css/professor.css">

</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">

            <div class="header-left">

                <div class="edu-logo">

                    EC

                </div>

                <div>

                    <h1>EduClass</h1>

                    <span>REGISTRO DE FREQUÊNCIA</span>

                </div>

            </div>

            <div class="header-right">

                <a href="/professor.html" class="header-button">

                    ←

                    <span>Voltar</span>

                </a>

                <a href="/logout" class="header-button logout-button">

                    ↪

                    <span>Sair</span>

                </a>

            </div>

        </header>

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <span class="card-label">

                        FREQUÊNCIA

                    </span>

                    <h2>

                        Chamada

                    </h2>

                </div>

                <div class="card-icon">

                    📋

                </div>

            </div>

            <p>

                Selecione a turma e registre a presença dos alunos.

            </p>

            <!-- SELEÇÃO DA TURMA -->

            <div class="input-group">

                <label for="turma">

                    TURMA

                </label>

                <select id="turma">

                    <option value="">

                        Selecione a turma

                    </option>

                </select>

            </div>

            <!-- LISTA DOS ALUNOS -->

            <div id="listaChamada">

                <p>

                    Selecione uma turma para carregar os alunos.

                </p>

            </div>

            <!-- BOTÃO -->

            <button

                type="button"

                id="btnRegistrar"

                class="save-planning"

            >

                Registrar chamada

            </button>

        </section>

        <footer class="dashboard-footer">

            <span>

                EDUCLASS PLATFORM

            </span>

            <span>

                Gestão Escolar Inteligente

            </span>

            <span>

                ©️ 2026

            </span>

        </footer>

    </main>

    <script src="js/chamada.js"></script>

</body>

</html>
