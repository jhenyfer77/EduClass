<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduClass - Painel do Gestor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex">

    <!-- Menu Lateral (Sidebar) -->
    <div class="w-64 bg-blue-800 h-screen text-white p-6 shadow-xl">
        <h1 class="text-2xl font-bold mb-8 text-center border-b border-blue-600 pb-4">EduClass</h1>
        <nav class="space-y-3">
            <a href="#" class="block py-2.5 px-4 rounded bg-blue-900 font-semibold">🏠 Início</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-blue-700 transition">👨‍🏫 Professores</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-blue-700 transition">🏫 Turmas e Aulas</a>
            <a href="/" class="block py-2.5 px-4 rounded hover:bg-red-600 transition mt-10">🚪 Sair</a>
        </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <h2 class="text-3xl font-bold text-gray-800">Painel Geral da Gestão</h2>
            <span class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full">Ambiente: Direção</span>
        </header>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-600">
                <p class="text-gray-500 font-medium uppercase text-xs">Total de Professores</p>
                <p class="text-2xl font-bold text-gray-800">12 Cadastrados</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500">
                <p class="text-gray-500 font-medium uppercase text-xs">Turmas Ativas</p>
                <p class="text-2xl font-bold text-gray-800">8 Turmas</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-purple-500">
                <p class="text-gray-500 font-medium uppercase text-xs">Alunos Matriculados</p>
                <p class="text-2xl font-bold text-gray-800">240 Alunos</p>
            </div>
        </div>
    </div>

            <!-- Formulário para Cadastrar Novo Professor -->
            <div class="mt-10 bg-white p-8 rounded-lg shadow-sm max-w-lg">
                <h3 class="text-xl font-bold text-gray-800 mb-6">➕ Cadastrar Novo Professor</h3>
                
                <form action="/cadastrar-professor" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1">Nome Completo</label>
                        <input type="text" name="nome" class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500" placeholder="Ex: Professor Roberto" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1">E-mail Institucional</label>
                        <input type="email" name="email" class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500" placeholder="roberto@escola.com" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1">Senha de Acesso</label>
                        <input type="password" name="senha" class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500" placeholder="Defina uma senha" required>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">
                        Salvar Novo Professor
                    </button>
                </form>
            </div>
    

</body>
</html>
