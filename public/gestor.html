<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - EduClass</title>
</head>
<body>

    <h1>EduClass Gestor</h1>
    
    <!-- Formulário de Recados -->
    <div>
        <h2>📢 Novo Recado</h2>
        <form id="formRecado">
            <label for="titulo">Título do Recado:</label><br>
            <input type="text" id="titulo" name="titulo" required><br><br>

            <label for="conteudo">Conteúdo do Aviso:</label><br>
            <textarea id="conteudo" name="conteudo" required></textarea><br><br>

            <label for="autor">Autor do Recado:</label><br>
            <input type="text" id="autor" name="autor" required><br><br>
            
            <button type="submit">Postar no Mural</button>
        </form>
    </div>

    <br><hr><br>

    <!-- Formulário do Calendário -->
    <div>
        <h2>📅 Adicionar Evento</h2>
        <form id="formEvento">
            <label for="titulo_evento">Nome do Evento:</label><br>
            <input type="text" id="titulo_evento" name="titulo" required><br><br>
            
            <label for="data_evento">Data de Realização:</label><br>
            <input type="date" id="data_evento" name="data_evento" required><br><br>

            <label for="descricao">Descrição Adicional:</label><br>
            <input type="text" id="descricao" name="descricao"><br><br>
            
            <button type="submit">Salvar Evento</button>
        </form>
    </div>

    <br><hr><br>

    <!-- Área de Exibição -->
    <div>
        <h2>📢 Mural de Avisos Ativos</h2>
        <div id="mural">Carregando recados...</div>

        <br>

        <h2>📅 Agenda Escolar</h2>
        <div id="calendario">Carregando eventos...</div>
    </div>

    <script>
        function carregarRecados() {
            fetch('/listar-recados')
                .then(res => res.json())
                .then(recados => {
                    const muralDiv = document.getElementById('mural');
                    if (!recados || recados.length === 0) {
                        muralDiv.innerHTML = '<p>Nenhum recado postado até o momento.</p>';
                        return;
                    }
                    muralDiv.innerHTML = recados.map(r => `
                        <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                            <h3>${r.titulo}</h3>
                            <p>${r.conteudo}</p>
                            <small>Por: <strong>${r.autor}</strong></small><br><br>
                            <button onclick="apagarItem('/apagar-recado/${r.id}', 'recado')">Apagar Recado</button>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('mural').innerHTML = '<p>Erro ao carregar recados.</p>';
                });
        }

        function carregarEventos() {
            fetch('/listar-eventos')
                .then(res => res.json())
                .then(eventos => {
                    const calendarioDiv = document.getElementById('calendario');
                    if (!eventos || eventos.length === 0) {
                        calendarioDiv.innerHTML = '<p>Nenhum evento agendado na agenda.</p>';
                        return;
                    }
                    calendarioDiv.innerHTML = eventos.map(e => `
                        <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                            <h3>${e.titulo}</h3>
                            <p>📅 Data: ${e.data_evento}</p>
                            ${e.descricao ? `<p>ℹ️ ${e.descricao}</p>` : ''}
                            <button onclick="apagarItem('/apagar-evento/${e.id}', 'evento')">Apagar Evento</button>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('calendario').innerHTML = '<p>Erro ao carregar eventos.</p>';
                });
        }

        function apagarItem(url, tipo) {
            if (confirm('Tem certeza que deseja remover este item permanentemente?')) {
                fetch(url, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => {
                        if (tipo === 'recado') carregarRecados();
                        if (tipo === 'evento') carregarEventos();
                    });
            }
        }

        document.getElementById('formRecado').addEventListener('submit', function(e) {
            e.preventDefault();
            const dados = new URLSearchParams(new FormData(this));
            
            fetch('/criar-recado', { method: 'POST', body: dados })
                .then(() => {
                    this.reset();
                    carregarRecados();
                });
        });

        document.getElementById('formEvento').addEventListener('submit', function(e) {
            e.preventDefault();
            const dados = new URLSearchParams(new FormData(this));
            
            fetch('/criar-evento', { method: 'POST', body: dados })
                .then(() => {
                    this.reset();
                    carregarEventos();
                });
        });

        // Executa ao carregar a página
        carregarRecados();
        carregarEventos();
    </script>
</body>
</html>
